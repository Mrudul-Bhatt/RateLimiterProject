global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The Level 7 gateway, run on the host with:
  #   dotnet run --project src/Level7.Gateway --urls http://localhost:5097
  - job_name: rate-limiter-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5097"]
