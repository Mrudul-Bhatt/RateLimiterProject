groups:
  - name: rate-limiter
    rules:
      # More than 5% of requests are being rejected — either an attack or a misconfigured limit.
      - alert: HighRejectionRate
        expr: |
          sum(rate(rate_limit_rejected_total[5m]))
            / clamp_min(sum(rate(rate_limit_requests_total[5m])), 1) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Rate-limit rejection rate > 5%"
          description: "{{ $value | humanizePercentage }} of gateway requests are being rejected."

      # The Redis circuit breaker is open — the gateway is running DEGRADED (fallback/fail-open/closed).
      - alert: RedisLimiterDegraded
        expr: rate_limit_circuit_open == 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Rate limiter degraded — Redis circuit open"
          description: "The gateway can't reach Redis and is enforcing via its degrade mode."

      # Redis p99 latency spike — the hot path is getting slow.
      - alert: RedisLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(redis_call_duration_seconds_bucket[5m])) by (le)) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Redis limiter p99 latency > 50ms"
          description: "p99 Redis call latency is {{ $value }}s."
