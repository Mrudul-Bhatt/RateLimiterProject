# Rate-limiter infrastructure.
#   Redis      — hot-path counters (L4+): shared, atomic rate-limit state.
#   Postgres   — durable source of truth (L6): plans, quota ledger, audit trail.
#   Prometheus — scrapes the L7 gateway's /metrics.
#   Grafana    — dashboards over Prometheus (login admin/admin), http://localhost:3000
#
#   docker compose up -d        # Redis(6379) Postgres(5432) Prometheus(9090) Grafana(3000)
#   docker compose down         # stop them
#
# Prometheus scrapes the gateway at host.docker.internal:5097 — run it with:
#   dotnet run --project src/Level7.Gateway --urls http://localhost:5097
#
services:
  redis:
    image: redis:7-alpine
    container_name: ratelimiter-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: ratelimiter-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ratelimiter
      POSTGRES_DB: ratelimiter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter"]
      interval: 2s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: ratelimiter-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: ratelimiter-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
