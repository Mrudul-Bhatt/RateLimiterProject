# Rate-limiter infrastructure.
#   Redis    — hot-path counters (L4+): shared, atomic rate-limit state.
#   Postgres — durable source of truth (L6): plans, quota ledger, audit trail.
# (Prometheus/Grafana get added here at Level 7.)
#
#   docker compose up -d        # start Redis (6379) + Postgres (5432)
#   docker compose down         # stop them
#
services:
  redis:
    image: redis:7-alpine
    container_name: ratelimiter-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: ratelimiter-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ratelimiter
      POSTGRES_DB: ratelimiter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter"]
      interval: 2s
      timeout: 3s
      retries: 10
